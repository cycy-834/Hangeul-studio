<script>

let st={};try{st=JSON.parse(localStorage.getItem('hs1'))||{}}catch(e){}
['srs','sv','er','dy','sk'].forEach(k=>st[k]=st[k]||{});
const sv=()=>{try{localStorage.setItem('hs1',JSON.stringify(st))}catch(e){}},td=()=>new Date().toISOString().slice(0,10);
function rec(s,ok,k){const o=st.sk[s]=st.sk[s]||{n:0,ok:0};o.n++;if(ok)o.ok++;st.dy[td()]=(st.dy[td()]||0)+1;if(!ok&&k)st.er[k]=(st.er[k]||0)+1;sv()}
function streak(){let n=0,d=new Date();if(!st.dy[td()])d.setDate(d.getDate()-1);while(st.dy[d.toISOString().slice(0,10)]){n++;d.setDate(d.getDate()-1)}return n}

const W=[['안녕하세요','annyeonghaseyo','Bonjour','Salutations','안녕하세요, 저는 지은이에요.','annyeonghaseyo, jeoneun jieunieyo','Bonjour, je suis Jieun.'],['감사합니다','gamsahamnida','Merci','Salutations'],['죄송합니다','joesonghamnida','Désolé(e) (poli)','Salutations'],['괜찮아요','gwaenchanayo','Ça va / Ce n’est pas grave','Salutations'],['주세요','juseyo','Donnez-moi, s’il vous plaît','Quotidien','물 주세요.','mul juseyo','De l’eau, s’il vous plaît.'],['어디예요?','eodiyeyo','Où est-ce ?','Quotidien','화장실이 어디예요?','hwajangsiri eodiyeyo','Où sont les toilettes ?'],['얼마예요?','eolmayeyo','Combien ça coûte ?','Quotidien'],['친구','chingu','Ami(e)','Quotidien'],['가족','gajok','Famille','Quotidien'],['시간','sigan','Temps / heure','Quotidien'],['물','mul','Eau','Nourriture'],['밥','bap','Riz / repas','Nourriture','밥을 먹어요.','babeul meogeoyo','Je mange (un repas).'],['커피','keopi','Café','Nourriture','커피를 마셔요.','keopireul masyeoyo','Je bois du café.'],['맛있어요','masisseoyo','C’est délicieux','Nourriture'],['배고파요','baegopayo','J’ai faim','Émotions'],['피곤해요','pigonhaeyo','Je suis fatigué(e)','Émotions'],['좋아요','joayo','C’est bien / J’aime','Émotions'],['사랑해요','saranghaeyo','Je t’aime','Émotions'],['학교','hakgyo','École','Lieux','학교에 가요.','hakgyoe gayo','Je vais à l’école.'],['집','jip','Maison','Lieux'],['병원','byeongwon','Hôpital','Lieux'],['지하철','jihacheol','Métro','Lieux','지하철을 타요.','jihacheoreul tayo','Je prends le métro.'],['대박','daebak','Génial ! (familier, jeunes)','Argot'],['화이팅','hwaiting','Courage ! / Allez ! (familier)','Argot'],['ㅋㅋ','keukeu','Mdr (SMS, familier)','Argot'],['ㅇㅋ','okei','OK (SMS, familier)','Argot'],['ㄱㅅ','gamsa','Merci (abrégé de 감사, SMS)','Argot'],['안녕히 계세요','annyeonghi gyeseyo','Au revoir (à celui qui reste)','Salutations'],['안녕히 가세요','annyeonghi gaseyo','Au revoir (à celui qui part)','Salutations'],['네','ne','Oui','Salutations'],['아니요','aniyo','Non','Salutations'],['처음 뵙겠습니다','cheoeum boepgesseumnida','Enchanté(e) (formel)','Salutations'],['잘 먹겠습니다','jal meokgesseumnida','Bon appétit (avant de manger)','Salutations'],['잘 지내요?','jal jinaeyo','Tu vas bien ?','Salutations'],['실례합니다','sillyehamnida','Excusez-moi','Salutations'],['이름','ireum','Nom','Quotidien'],['나이','nai','Âge','Quotidien'],['오늘','oneul','Aujourd’hui','Quotidien'],['내일','naeil','Demain','Quotidien'],['어제','eoje','Hier','Quotidien'],['지금','jigeum','Maintenant','Quotidien'],['사람','saram','Personne','Quotidien'],['전화','jeonhwa','Téléphone','Quotidien'],['돈','don','Argent','Quotidien'],['책','chaek','Livre','Quotidien','책을 읽어요.','chaegeul ilgeoyo','Je lis un livre.'],['여기','yeogi','Ici','Quotidien'],['화장실','hwajangsil','Toilettes','Quotidien'],['김치','gimchi','Kimchi','Nourriture'],['고기','gogi','Viande','Nourriture'],['과일','gwail','Fruit','Nourriture'],['우유','uyu','Lait','Nourriture'],['차','cha','Thé','Nourriture'],['빵','ppang','Pain','Nourriture'],['맥주','maekju','Bière','Nourriture'],['계란','gyeran','Œuf','Nourriture'],['식당','sikdang','Restaurant','Nourriture'],['매워요','maewoyo','C’est épicé','Nourriture'],['도서관','doseogwan','Bibliothèque','Lieux'],['공항','gonghang','Aéroport','Lieux'],['역','yeok','Gare / station','Lieux'],['은행','eunhaeng','Banque','Lieux'],['가게','gage','Magasin','Lieux'],['카페','kape','Café (lieu)','Lieux'],['한국','hanguk','Corée','Lieux'],['행복해요','haengbokhaeyo','Je suis heureux(se)','Émotions'],['슬퍼요','seulpeoyo','Je suis triste','Émotions'],['무서워요','museowoyo','J’ai peur','Émotions'],['재미있어요','jaemiisseoyo','C’est amusant','Émotions'],['보고 싶어요','bogo sipeoyo','Tu me manques / J’ai envie de te voir','Émotions'],['대학교','daehakgyo','Université','Études/Travail'],['공부','gongbu','Étude','Études/Travail'],['수업','sueop','Cours','Études/Travail'],['시험','siheom','Examen','Études/Travail'],['회사','hoesa','Entreprise','Études/Travail'],['일','il','Travail','Études/Travail'],['버스','beoseu','Bus','Transports'],['택시','taeksi','Taxi','Transports'],['기차','gicha','Train','Transports'],['여행','yeohaeng','Voyage','Voyage'],['호텔','hotel','Hôtel','Voyage'],['예약','yeyak','Réservation','Voyage'],['아파요','ap const G=[{t:'Particules 은/는, 이/가, 을/를',b:`<p><b>Construction.</b> Nom + particule. Après une consonne : 은 / 이 / 을. Après une voyelle : 는 / 가 / 를.</p><p><b>Rôles.</b> 은/는 marque le thème (« quant à moi… ») ; 이/가 marque le sujet ; 을/를 marque le complément d’objet. L’ordre est sujet – objet – verbe.</p><p><b>Comparaison.</b> 저는 = « moi, je… » (thème, contraste) ; 제가 = « c’est moi qui… » (sujet mis en avant, information nouvelle).</p><p><b>À l’oral</b> les particules sont souvent omises entre amis.</p>`,e:[['저는 학생이에요.','jeoneun haksaengieyo','Je suis étudiante.'],['친구가 와요.','chinguga wayo','Un(e) ami(e) arrive.'],['커피를 마셔요.','keopireul masyeoyo','Je bois du café.'],['밥을 먹어요.','babeul meogeoyo','Je mange.']],q:[{p:'커피___ 마셔요.<div class="pr">keopi___ masyeoyo · Je bois du café.</div>',o:['을|eul','를|reul'],a:1,x:'커피 finit par une voyelle → 를.'},{p:'저___ 학생이에요.<div class="pr">jeo___ haksaengieyo · Moi, je suis étudiante.</div>',o:['은|eun','는|neun'],a:1,x:'저 finit par une voyelle → 는.'},{p:'밥___ 맛있어요.<div class="pr">bap___ masisseoyo · Le repas est délicieux.</div>',o:['이|i','가|ga'],a:0,x:'밥 finit par une consonne (ㅂ) → 이.'},{p:'선생님___ 와요.<div class="pr">seonsaengnim___ wayo · Le professeur arrive.</div>',o:['이|i','가|ga'],a:0,x:'선생님 finit par la consonne ㅁ → 이.'},{p:'책___ 읽어요.<div class="pr">chaek___ ilgeoyo · Je lis un livre.</div>',o:['을|eul','를|reul'],a:0,x:'책 finit par une consonne (ㄱ) → 을.'},{p:'친구___ 한국 사람이에요.<div class="pr">chingu___ hanguk saramieyo · Mon ami(e) est coréen(ne).</div>',o:['은|eun','는|neun'],a:1,x:'친구 finit par une voyelle → 는.'}]},{t:'Le style poli : -아요 / -어요',b:`<p><b>Construction.</b> Radical du verbe + 아요 si la dernière voyelle est ㅏ ou ㅗ ; sinon + 어요. Les verbes en 하다 donnent 해요.</p><p><b>Niveaux de politesse.</b> 합니다체 (formel : 갑니다), 해요체 (poli courant : 가요), 해체 (familier : 가). Avec un inconnu ou un aîné, utilise 해요체.</p><p><b>Exceptions.</b> Certains radicaux se contractent (오다 → 와요, 마시다 → 마셔요) et d’autres sont irréguliers (듣다 → 들어요).</p>`,e:[['가
