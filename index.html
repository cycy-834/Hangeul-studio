<!doctype html>
<html lang="fr"><head><meta charset="utf-8">

<title>Hangeul Studio</title>

<style>
:root{--bg:#faf6f3;--sf:#fff;--ink:#2b2837;--mut:#7a7587;--ac:#6a5fc4;--ac2:#eeeafb;--pk:#f7e4ea;--ok:#2f9e6e;--no:#d2546a;--ln:#e9e3de;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);font-family:Figtree,system-ui,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#17151f;--sf:#221f2d;--ink:#f0edf6;--mut:#a29cb3;--ac:#a99cf5;--ac2:#2e2945;--pk:#3a2631;--ln:#34303f}}
:root[data-theme=dark]{color-scheme:dark;--bg:#17151f;--sf:#221f2d;--ink:#f0edf6;--mut:#a29cb3;--ac:#a99cf5;--ac2:#2e2945;--pk:#3a2631;--ln:#34303f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);line-height:1.5}
main{padding:16px 16px 100px}.w{max-width:720px;margin:0 auto}
h2{font-size:1.5rem;margin:.2em 0 .6em}h3{margin:.2em 0 .5em}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:var(--sf);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav a{flex:none;min-width:66px;text-align:center;font-size:.72rem;padding:6px 4px;color:var(--mut);text-decoration:none;border-radius:12px}
nav a span{display:block;font-size:1.25rem}nav a.on{background:var(--ac2);color:var(--ac);font-weight:600}
@media(min-width:900px){nav{top:0;bottom:auto;right:auto;width:176px;flex-direction:column;border-top:0;border-right:1px solid var(--ln);padding:calc(16px + env(safe-area-inset-top,0px)) 10px 16px}nav a{display:flex;gap:10px;align-items:center;text-align:left;font-size:.9rem}nav a span{display:inline}main{padding:24px 24px 24px 200px}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:16px;margin:0 0 14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;font-size:1.05rem}
.ko{font-family:'Noto Sans KR',sans-serif;font-size:1.3rem;font-weight:600}.big{font-size:2.4rem;font-family:'Noto Sans KR',sans-serif;font-weight:600}
.pr{color:var(--ac);font-size:.9rem}.fr{color:var(--mut)}small{color:var(--mut)}
.tr{display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--ln)}.tr:last-child{border:0}
.sp{border:0;background:var(--ac2);border-radius:50%;width:40px;height:40px;flex:none;font-size:16px;cursor:pointer}
.b,.opt,.chip{font:inherit;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:12px;padding:10px 14px;cursor:pointer;margin:3px 3px 3px 0}
.pri{background:var(--ac);color:#fff;border-color:var(--ac)}.opt{display:block;width:100%;text-align:left}.opt small{display:block}
.opt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.opt.no{background:var(--no);color:#fff;border-color:var(--no)}.opt.ok small,.opt.no small{color:#fff}
.chip{border-radius:20px;padding:6px 12px;font-size:.85rem}.chip.on{background:var(--ac2);color:var(--ac);border-color:var(--ac)}
input{font:inherit;font-size:1.2rem;width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--ln);border-radius:12px;background:var(--bg);color:var(--ink);margin:6px 0}
.bar{height:10px;background:var(--ac2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{display:block;text-decoration:none;color:inherit;background:var(--pk);border-radius:16px;padding:14px}
.pad{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;position:relative;background:#fff;border:1px solid var(--ln);border-radius:14px;height:260px;background-image:linear-gradient(#ece8f5 1px,transparent 1px),linear-gradient(90deg,#ece8f5 1px,transparent 1px);background-size:32px 32px;overflow:hidden}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;-webkit-user-select:none;user-select:none}.pad .mod{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:7rem;font-family:'Noto Sans KR',sans-serif;color:#6a5fc4;opacity:.14;pointer-events:none}
.x{margin:10px 0}.q{font-size:1.1rem;margin:8px 0}details{border-top:1px solid var(--ln);padding:8px 0}summary{cursor:pointer}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--ln)}
.note{background:var(--pk);border-radius:12px;padding:10px 12px;font-size:.88rem}
</style></head><body>

const W=[['안녕하세요','annyeonghaseyo','Bonjour','Salutations','안녕하세요, 저는 지은이에요.','annyeonghaseyo, jeoneun jieunieyo','Bonjour, je suis Jieun.'],['감사합니다','gamsahamnida','Merci','Salutations'],['죄송합니다','joesonghamnida','Désolé(e) (poli)','Salutations'],['괜찮아요','gwaenchanayo','Ça va / Ce n’est pas grave','Salutations'],['주세요','juseyo','Donnez-moi, s’il vous plaît','Quotidien','물 주세요.','mul juseyo','De l’eau, s’il vous plaît.'],['어디예요?','eodiyeyo','Où est-ce ?','Quotidien','화장실이 어디예요?','hwajangsiri eodiyeyo','Où sont les toilettes ?'],['얼마예요?','eolmayeyo','Combien ça coûte ?','Quotidien'],['친구','chingu','Ami(e)','Quotidien'],['가족','gajok','Famille','Quotidien'],['시간','sigan','Temps / heure','Quotidien'],['물','mul','Eau','Nourriture'],['밥','bap','Riz / repas','Nourriture','밥을 먹어요.','babeul meogeoyo','Je mange (un repas).'],['커피','keopi','Café','Nourriture','커피를 마셔요.','keopireul masyeoyo','Je bois du café.'],['맛있어요','masisseoyo','C’est délicieux','Nourriture'],['배고파요','baegopayo','J’ai faim','Émotions'],['피곤해요','pigonhaeyo','Je suis fatigué(e)','Émotions'],['좋아요','joayo','C’est bien / J’aime','Émotions'],['사랑해요','saranghaeyo','Je t’aime','Émotions'],['학교','hakgyo','École','Lieux','학교에 가요.','hakgyoe gayo','Je vais à l’école.'],['집','jip','Maison','Lieux'],['병원','byeongwon','Hôpital','Lieux'],['지하철','jihacheol','Métro','Lieux','지하철을 타요.','jihacheoreul tayo','Je prends le métro.'],['대박','daebak','Génial ! (familier, jeunes)','Argot'],['화이팅','hwaiting','Courage ! / Allez ! (familier)','Argot'],['ㅋㅋ','keukeu','Mdr (SMS, familier)','Argot'],['ㅇㅋ','okei','OK (SMS, familier)','Argot'],['ㄱㅅ','gamsa','Merci (abrégé de 감사, SMS)','Argot'],['안녕히 계세요','annyeonghi gyeseyo','Au revoir (à celui qui reste)','Salutations'],['안녕히 가세요','annyeonghi gaseyo','Au revoir (à celui qui part)','Salutations'],['네','ne','Oui','Salutations'],['아니요','aniyo','Non','Salutations'],['처음 뵙겠습니다','cheoeum boepgesseumnida','Enchanté(e) (formel)','Salutations'],['잘 먹겠습니다','jal meokgesseumnida','Bon appétit (avant de ayo','J’ai mal / Je suis malade','Santé'],['약','yak','Médicament','Santé'],['의사','uisa','Médecin','Santé'],['헐','heol','Waouh / Sérieux ? (familier)','Argot'],['진짜','jinjja','Vraiment / sérieux (familier)','Argot'],['아싸','assa','Yes ! (familier)','Argot'],['꿀잼','kkuljaem','Trop fun (argot des jeunes)','Argot'],['쩐다','jjeonda','Ouf, trop bien (argot)','Argot']];
const G=[{t:'Particules 은/는, 이/가, 을/를',b:`<p><b>Construction.</b> Nom + particule. Après une consonne : 은 / 이 / 을. Après une voyelle : 는 / 가 / 를.</p><p><b>Rôles.</b> 은/는 marque le thème (« quant à moi… ») ; 이/가 marque le sujet ; 을/를 marque le complément d’objet. L’ordre est sujet – objet – verbe.</p><p><b>Comparaison.</b> 저는 = « moi, je… » (thème, contraste) ; 제가 = « c’est moi qui… » (sujet mis en avant, information nouvelle).</p><p><b>À l’oral</b> les particules sont souvent omises entre amis.</p>`,e:[['저는 학생이에요.','jeoneun haksaengieyo','Je suis étudiante.'],['친구가 와요.','chinguga wayo','Un(e) ami(e) arrive.'],['커피를 마셔요.','keopireul masyeoyo','Je bois du café.'],['밥을 먹어요.','babeul meogeoyo','Je mange.']],q:[{p:'커피___ 마셔요.<div class="pr">keopi___ masyeoyo · Je bois du café.</div>',o:['을|eul','를|reul'],a:1,x:'커피 finit par une voyelle → 를.'},{p:'저___ 학생이에요.<div class="pr">jeo___ haksaengieyo · Moi, je suis étudiante.</div>',o:['은|eun','는|neun'],a:1,x:'저 finit par une voyelle → 는.'},{p:'밥___ 맛있어요.<div class="pr">bap___ masisseoyo · Le repas est délicieux.</div>',o:['이|i','가|ga'],a:0,x:'밥 finit par une consonne (ㅂ) → 이.'},{p:'선생님___ 와요.<div class="pr">seonsaengnim___ wayo · Le professeur arrive.</div>',o:['이|i','가|ga'],a:0,x:'선생님 finit par la consonne ㅁ → 이.'},{p:'책___ 읽어요.<div class="pr">chaek___ ilgeoyo · Je lis un livre.</div>',o:['을|eul','를|reul'],a:0,x:'책 finit par une consonne (ㄱ) → 을.'},{p:'친구___ 한국 사람이에요.<div class="pr">chingu___ hanguk saramieyo · Mon ami(e) est coréen(ne).</div>',o:['은|eun','는|neun'],a:1,x:'친구 finit par une voyelle → 는.'}]},{t:'Le style poli : -아요 / -어요',b:`<p><b>Construction.</b> Radical du verbe + 아요 si la dernière voyelle est ㅏ ou ㅗ ; sinon + 어요. Les verbes en 하다 donnent 해요.</p><p><b>Niveaux de politesse.</b> 합니다체 (formel : 갑니다), 해요체 (poli courant : 가요), 해체 (familier : 가). Avec un inconnu ou un aîné, utilise 해요체.</p><p><b>Exceptions.</b> Certains radicaux se contractent (오다 → 와요, 마시다 → 마셔요) et d’autres sont irréguliers (듣다 → 들어요).</p>`,e:[['가요.','gayo','Je vais / Il va.'],['먹어요.','meogeoyo','Je mange.'],['좋아요.','joayo','C’est bien.'],['해요.','haeyo','Je fais.']],q:[{p:'먹다 → 해요체<div class="pr">meokda · manger</div>',o:['먹아요|meogayo','먹어요|meogeoyo'],a:1,x:'Dernière voyelle ㅓ → 어요.'},{p:'좋다 → 해요체<div class="pr">jotda · être bien</div>',o:['좋아요|joayo','좋어요|joeoyo'],a:0,x:'Voyelle ㅗ → 아요.'},{p:'공부하다 → 해요체<div class="pr">gongbuhada · étudier</div>',o:['공부해요|gongbuhaeyo','공부하아요|gongbuhaayo'],a:0,x:'하다 → 해요.'},{p:'오다 → 해요체<div class="pr">oda · venir</div>',o:['오아요|oayo','와요|wayo'],a:1,x:'오 + 아요 se contracte en 와요.'},{p:'마시다 → 해요체<div class="pr">masida · boire</div>',o:['마시어요|masieoyo','마셔요|masyeoyo'],a:1,x:'시 + 어요 se contracte en 셔요.'},{p:'가다 → 해요체<div class="pr">gada · aller</div>',o:['가요|gayo','가아요|gaayo'],a:0,x:'Deux ㅏ identiques fusionnent : 가요.'}]},{t:'Particules de lieu : 에 / 에서',b:`<p><b>에</b> : destination (학교에 가요), moment (세 시에), lieu d’existence avec 있다/없다.</p><p><b>에서</b> : lieu où se déroule une action (카페에서 공부해요) ou point de départ (한국에서 왔어요).</p><p><b>Comparaison.</b> On va <i>à</i> un endroit avec 에 ; on agit <i>dans</i> un endroit avec 에서.</p>`,e:[['학교에 가요.','hakgyoe gayo','Je vais à l’école.'],['집에 있어요.','jibe isseoyo','Je suis à la maison.'],['카페에서 공부해요.','kapeeseo gongbuhaeyo','J’étudie au café.'],['한국에서 왔어요.','hangugeseo wasseoyo','Je viens de Corée.']],q:[{p:'학교___ 가요.<div class="pr">hakgyo___ gayo · Je vais à l’école.</div>',o:['에|e','에서|eseo'],a:0,x:'Destination → 에.'},{p:'카페___ 공부해요.<div class="pr">kape___ gongbuhaeyo · J’étudie au café.</div>',o:['에|e','에서|eseo'],a:1,x:'Lieu d’une action → 에서.'},{p:'집___ 있어요.<div class="pr">jip___ isseoyo · Je suis à la maison.</div>',o:['에|e','에서|eseo'],a:0,x:'Existence (있다) → 에.'},{p:'한국___ 왔어요.<div class="pr">hanguk___ wasseoyo · Je viens de Corée.</div>',o:['에|e','에서|eseo'],a:1,x:'Point de départ → 에서.'},{p:'도서관___ 책을 읽어요.<div class="pr">doseogwan___ chaegeul ilgeoyo · Je lis un livre à la bibliothèque.</div>',o:['에|e','에서|eseo'],a:1,x:'Action dans un lieu → 에서.'}]}];

V.profile=el=>{const S=Object.keys(st.srs).length,Mx=Object.values(st.srs).filter(c=>c.b>=4).length,tot=Object.values(st.sk).reduce((a,o)=>a+o.n,0),ok=Object.values(st.sk).reduce((a,o)=>a+o.ok,0),er=Object.entries(st.er).sort((a,b)=>b[1]-a[1]).slice(0,6);el.innerHTML=`<h2>Mon profil</h2><div class="card"><div class="row"><span>Mots appris</span><b>${S}</b></div><div class="row"><span>Mots maîtrisés</span><b>${Mx}</b></div><div class="row"><span>Taux de réussite</span><b>${tot?Math.round(100*ok/tot):0} %</b></div><div class="row"><span>Série</span><b>${streak()} j</b></div><div class="row"><span>Exercices faits</span><b>${tot}</b></div></div><div class="card"><b>Compétences</b>${['Vocabulaire','Grammaire','Conjugaison','Écriture','Écoute','Oral','Tests'].map(k=>{const o=st.sk[k]||{n:0,ok:0},p=o.n?Math.round(100*o.ok/o.n):0;return`<div class="row"><span>${k} <small>(${o.n})</small></span><span>${p} %</span></div><div class="bar"><i style="width:${p}%"></i></div>`}).join('')}</div><div class="card"><b>Historique des erreurs</b>${er.map(e=>`<div class="row"><span class="ko">${e[0]}</span><span>${e[1]}×</span></div>`).join('')||'<p class="fr">Aucune erreur pour l’instant.</p>'}</div><button class="b" id="rs">Réinitialiser mes données</button>`;$('#rs').onclick=()=>{if(confirm('Tout effacer ?')){localStorage.removeItem('hs1');location.reload()}}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
V.tutor=async el=>{const sc=['Conversation libre','Commander dans un café à Séoul','Au restaurant','Demander son chemin','Acheter un ticket de métro','Faire connaissance avec un étudiant','Réserver une chambre','Entretien d’embauche','Shopping','Au téléphone'];let h=[],busy=0;el.innerHTML=`<h2>Prof IA</h2><p class="fr">Une professeure virtuelle parle coréen simple, ajoute la prononciation, cache la traduction jusqu’à ce que tu la demandes et corrige tes erreurs.</p><select id="ts" class="b">${sc.map(s=>`<option>${s}</option>`).join('')}</select><button class="b pri" id="tg">Démarrer</button><div id="tl"></div><div id="tf" style="display:none"><input id="ti" lang="ko" placeholder="Réponds en coréen (ou en français pour une explication)"><button class="b pri" id="tn">Envoyer</button><button class="b" id="tm" style="display:none">🎤</button></div>`;

const ask=async()=>{const sm=window.claude?await claude.use('sample'):null;if(!sm){h.push({role:'assistant',raw:'{}',o:{ko:'',note:'Le Prof IA n’est disponible que dans la page ouverte depuis Claude.'}});r();return}busy=1;r();const SYS=`Tu es une professeure particulière de coréen pour une francophone débutante (hangeul connu, niveau TOPIK 1). Scénario : ${$('#ts').value}. Parle en coréen simple, style poli 해요체, 1 à 2 phrases courtes, comme une vraie personne. Si elle fait une erreur, corrige-la en une phrase de français dans "note" puis relance. Si elle écrit en français pour une explication, réponds en français dans "note". Termine par une question ou une relance. Réponds UNIQUEMENT en JSON : {"ko":"texte coréen","pron":"romanisation puis prononciation à la française entre parenthèses","fr":"traduction française","note":"correction ou explication, sinon chaîne vide"}`;try{const o=await sm.json(h.map((m,i)=>({role:m.role,content:(i?'':SYS+'\n\n')+m.raw})),{cache:false});h.push({role:'assistant',raw:JSON.stringify(o),o})}catch(e){h.push({role:'assistant',raw:'{}',o:{ko:'',note:'Erreur ('+(e.code||'?')+'). Réessaie dans un instant.'}})}busy=0;r()};
$('#tg').onclick=()=>{h=[{role:'user',raw:'Commence la conversation.'}];$('#tf').style.display='block';ask()};$('#tn').onclick=()=>{const v=$('#ti').value.trim();if(!v||busy)return;h.push({role:'user',raw:v});$('#ti').value='';r();ask()};
const d=window.claude?await claude.use('dictation'):null;if(d&&$('#tm')){$('#tm').style.display='inline-block';d.onFinal(({text})=>{$('#ti').value+=text+' '});$('#tm').onclick=()=>d.start().catch(()=>{})}};
